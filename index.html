<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11162b">
<title>太空基地指挥官</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1022; --panel: #171c32; --raised: #1d243e; --edge: #303a57;
  --text: #f1f3ff; --muted: #aab6d5; --lime: #daff8f; --cyan: #7aeae0;
  --gold: #ffda8a; --purple: #c8b2ff; --rose: #ff9caa;
  font-family: "Nunito", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(ellipse at 11% 0%, #252343 0, transparent 40rem), var(--bg); color: var(--text); }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--edge); border-radius: 11px; background: var(--raised); min-height: 42px; }
button:not(:disabled):hover { filter: brightness(1.15); }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
button[aria-pressed="true"] { border-color: var(--cyan); }
[hidden] { display: none !important; }
.wrap { width: min(1280px, calc(100% - 56px)); margin-inline: auto; }
.top { border-bottom: 1px solid #282e47; background: #13172be8; }
.top-inner { min-height: 71px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 17px; font-weight: 850; }
.brand-emblem { width: 38px; height: 38px; display: grid; place-items: center; font-size: 24px; color: #171a32; background: var(--lime); border-radius: 11px; }
.top-actions, .action-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top-actions button, .action-row button { padding: 0 13px; }
.top-actions .archive { color: var(--purple); }
.top-actions .sound-toggle { width: 42px; padding: 0; font-size: 17px; line-height: 1; }
.sound-toggle[aria-pressed="false"] { color: var(--muted); }
main { padding: 26px 0 40px; }
.intro { position: relative; isolation: isolate; display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 27px 28px 25px; border-radius: 19px; overflow: hidden; border: 1px solid #454265; background: radial-gradient(ellipse at 77% 85%, #384478, transparent 50%), linear-gradient(110deg,#242442,#23223d 55%,#181b37); }
.intro::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(circle, #ffffffa8 1px, transparent 1.5px) 4px 17px / 89px 67px, radial-gradient(circle, #b7c5ff80 1px, transparent 1.4px) 11px 4px / 137px 53px; opacity: .55; mask-image: linear-gradient(90deg, transparent 12%, black 57%); }
.planet { --p-light: #c8c3ff; --p-mid: #686bb7; --p-dark: #262c64; width: clamp(155px, 30vw, 370px); aspect-ratio: 1; position: absolute; right: 9%; top: -65%; z-index: -1; border-radius: 50%; background: radial-gradient(ellipse at 58% 35%, #24284652 0 9%, transparent 10%), radial-gradient(ellipse at 37% 56%, #20254d57 0 4.5%, #bbbaff4d 5%, transparent 6.5%), radial-gradient(ellipse at 32% 28%, #939bd45a 0 6%, transparent 7%), radial-gradient(circle at 34% 23%, var(--p-light), var(--p-mid) 38%,var(--p-dark) 68%, #252749 80%); box-shadow: 0 0 42px #9ea4ff29, inset 0 0 8px #c0c1fc50; opacity: .88; }
.planet::after { content: ""; position: absolute; inset: 33% -20%; border-radius: 50%; border: 1px solid #d9d2ff80; transform: rotate(-25deg); box-shadow: 0 0 0 7px #b3aaff1b; }
.eyebrow { color: var(--lime); font-size: 12px; font-weight: 800; letter-spacing: .12em; display: flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
h1, h2, h3, p { margin: 0; }
h1 { margin-top: 5px; font-size: clamp(30px, 4vw, 49px); line-height: 1.14; letter-spacing: -.03em; font-weight: 900; text-shadow: 0 2px 16px #0d1022; }
.intro p { margin-top: 10px; color: #e0e3ff; line-height: 1.55; }
.progress-pill { display: flex; align-items: center; align-self: start; gap: 7px; white-space: nowrap; padding: 8px 11px; background: #12162ddd; border: 1px solid #63658c; border-radius: 9px; font-size: 13px; font-weight: 800; }
.progress-pill strong { color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 14px 0; }
.stat { min-width: 0; display: flex; align-items: center; gap: 11px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--edge); border-radius: 13px; }
.stat-mark { background: var(--raised); border: 1px solid var(--edge); border-radius: 9px; display: grid; place-items: center; flex: 0 0 35px; height: 35px; color: var(--tint); font-size: 20px; font-weight: 900; }
.stat-data { flex: 1; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat b span { font-size: 12px; color: var(--muted); }
.meter { display: block; width: min(100%,135px); margin-top: 3px; height: 3px; background: #2f3750; border-radius: 8px; overflow: hidden; }
.meter > i { display: block; width: 100%; height: 100%; background: var(--tint); transition: width .2s; }
.desk { display: grid; grid-template-columns: minmax(0,1fr) 306px; gap: 14px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; min-width: 0; }
.board-panel { overflow: hidden; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 10px 15px; }
.bar h2, .gear h2 { font-size: 16px; font-weight: 850; }
.live-state { color: var(--cyan); background: #1d343e; border: 1px solid #34515a; border-radius: 6px; font-size: 12px; padding: 3px 8px; white-space: nowrap; }
.field { isolation: isolate; position: relative; aspect-ratio: 800 / 436; background: #161d39; overflow: hidden; }
.field.dust::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(156deg,#f9a26862, #ac5a302b 65%, #120e2340); }
.field canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.board-control, .map-tag { position: absolute; transform: translate(-50%,-50%); z-index: 2; }
.board-control { --unit: clamp(35px,4.7vw,56px); width: var(--unit); min-height: var(--unit); padding: 0; border-radius: 13px; border: 1px dashed #b9c9ff84; background: #172041af; color: #e1e8ff; display: grid; place-items: center; font-weight: 900; font-size: clamp(16px, 2.4vw, 27px); box-shadow: 0 4px 0 #10162d88; touch-action: manipulation; }
.board-control.is-ready { border-color: #b9eac19e; background: #253852d9; color: var(--lime); }
.board-control.placed { border-style: solid; border-color: var(--bot); color: var(--bot); background: #15203eef; }
.board-control[aria-pressed="true"] { outline: 2px solid var(--lime); outline-offset: 3px; }
.board-control.sun-empty::after, .board-control.shade-empty::after { content: "☀"; font-size: 10px; position: absolute; top: 1px; right: 4px; color: var(--gold); }
.board-control.shade-empty::after { content: "◐"; color: var(--purple); }
.board-control .pad-zone { position: absolute; top: 2px; left: 4px; font-size: 9px; line-height: 1; color: var(--zone-color); }
.bot-level { position: absolute; bottom: -5px; right: -5px; border: 1px solid var(--bot); color: var(--bot); border-radius: 4px; padding-inline: 3px; background: #141d37; font-size: 9px; }
.scan-pin { border: 1px solid #e3cfff; border-radius: 50%; background: #624c97; color: white; box-shadow: 0 0 0 5px #c8a2ff28, 0 0 20px #c8a2ff7a; }
.scan-pin.found { background: #245548; color: var(--lime); border-color: var(--lime); box-shadow: 0 0 0 4px #a7ffac28; }
.map-tag { pointer-events: none; z-index: 1; color: #fff2f0; font-size: clamp(9px,1.1vw,12px); font-weight: 850; text-align: center; white-space: nowrap; padding: 3px 6px; background: #181932de; border: 1px solid #a36e87; border-radius: 6px; }
.map-tag.base { border-color: #69c7c6; color: #cbfff4; }
.board-foot { padding: 9px 14px 12px; }
.board-foot p { line-height: 1.5; min-height: 2.9em; display: flex; align-items: center; font-size: 13px; color: #dee5fd; }
.secondary { color: var(--muted); }
.wide { flex: 1; min-width: 128px; }
.primary { background: var(--lime); color: #1c2822; border-color: #ecffc2; font-weight: 900; }
.primary:disabled { opacity: .65; }
.mini { font-size: 13px; }
.side { display: grid; gap: 12px; }
.gear { padding: 13px; }
.gear-heading { display: flex; justify-content: space-between; gap: 5px; align-items: center; margin-bottom: 9px; }
.gear-heading small { color: var(--muted); font-size: 11px; }
.plan { padding: 12px 14px; border-bottom: 1px solid var(--edge); }
.plan-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 12px; align-items: baseline; margin-bottom: 7px; }
.plan-head h3 { font-size: 14px; }
.plan-head b { font-size: 12px; color: var(--gold); }
.plan-zones { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 5px; }
.plan-zone { min-width: 0; border: 1px solid var(--edge); border-top: 2px solid var(--zone-color); border-radius: 7px; padding: 5px 7px 6px; background: #151a2f; }
.plan-zone h4 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 5px; margin: 0 0 3px; font-size: 12px; color: var(--zone-color); }
.plan-zone h4 small { color: var(--muted); font-size: 10px; }
.plan-zone p { font-size: 11px; line-height: 1.45; }
.plan-zone p + p { margin-top: 3px; }
.plan-zone p small { color: var(--muted); font-size: 10px; }
.plan-zone .met { color: var(--cyan); }
.plan-zone .short { color: var(--rose); }
.plan-note { margin-top: 5px; font-size: 11px; line-height: 1.5; color: var(--muted); }
.launch-form { display: grid; gap: 9px; margin-top: 12px; }
.launch-warning { padding: 10px 12px; border: 1px solid #a75970; border-radius: 9px; background: #41283a; color: #ffd3dd; }
.launch-form input { width: 100%; min-height: 43px; padding: 6px 10px; border-radius: 8px; border: 1px solid #7380a4; background: #11172d; color: var(--text); font: inherit; }
.launch-feedback { min-height: 1.5em; color: var(--gold); }
.build-list { display: grid; gap: 6px; }
.build-card { display: grid; grid-template-columns: 35px minmax(0,1fr) auto; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 6px 8px; border-color: #384360; min-height: 48px; }
.build-card[aria-pressed="true"] { background: #28364e; }
.build-card:disabled { opacity: .54; }
.build-card.unaffordable:not(:disabled) .cost { color: #baa6a9; }
.unit-mark { display: grid; place-items: center; border-radius: 8px; width: 33px; height: 33px; background: #131b33; color: var(--bot); font-size: 22px; font-weight: 900; }
.build-name { display: block; font-weight: 850; font-size: 13px; }
.build-card small { display: block; margin-top: 1px; color: #bdc7e3; font-size: 11px; }
.cost { color: var(--gold); font-size: 12px; font-weight: 850; white-space: nowrap; }
.manage { margin-top: 9px; border-top: 1px solid var(--edge); padding-top: 8px; }
.manage p { font-size: 12px; line-height: 1.55; margin-bottom: 6px; }
.manage .action-row button { font-size: 11px; padding-inline: 7px; min-height: 32px; }
.manage button:disabled { opacity: .5; }
.research { padding: 12px; border-color: #50446f; background: radial-gradient(ellipse at 100% 5%, #442e5b, transparent 70%), #251f3d; }
.research button { display: grid; width: 100%; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; text-align: left; }
.research .unit-mark { color: var(--purple); background: #42325f; }
.research strong { display: block; font-size: 14px; color: #f0e8ff; }
.research small { display: block; color: #cfc0e9; font-size: 12px; margin-top: 2px; }
.research .chev { color: var(--purple); font-size: 20px; padding-right: 4px; }
.route { margin-top: 19px; padding: 15px; }
.route-header { display: flex; align-items: baseline; justify-content: space-between; gap: 9px; margin-bottom: 11px; }
.route h2 { font-size: 17px; }
.route-header small { color: var(--muted); font-size: 12px; }
.chapters { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 7px; }
.chapter { border: 1px solid var(--edge); border-radius: 10px; padding: 8px; min-width: 0; }
.chapter.current { border-color: #6b9584; background: #1d2c38; }
.chapter h3 { font-size: 12px; color: var(--mark); margin-bottom: 6px; }
.chapter-levels { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 4px; }
.chapter-levels button { background: #242e4a; min-height: 36px; padding: 2px 0; font-size: 12px; font-weight: 850; border-radius: 7px; }
.chapter-levels button:disabled { opacity: .55; }
.chapter-levels button[aria-current="step"] { color: #1a2b2b; border-color: var(--lime); background: var(--lime); }
.chapter-levels small { display: block; color: var(--gold); font-size: 8px; line-height: 1.1; min-height: 9px; }
.chapter-levels button[aria-current="step"] small { color: #364b34; }
dialog { width: min(480px,calc(100% - 26px)); max-height: 90vh; max-height: 90dvh; border: 1px solid #646590; border-radius: 19px; padding: 21px; color: var(--text); background: #1a2039; box-shadow: 0 24px 100px #060a1cbd; }
dialog::backdrop { background: #090d1fc8; backdrop-filter: blur(4px); }
.dialog-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 12px; }
.dialog-head h2 { font-size: 22px; }
.close { min-width: 38px; min-height: 38px; padding: 0; font-size: 20px; }
.dialog-body { color: #d5def7; font-size: 14px; line-height: 1.6; }
.dialog-body p + p { margin-top: 8px; }
.dialog-body h3 { color: var(--text); margin: 10px 0 5px; font-size: 15px; }
.dialog-body ol { padding-left: 22px; }
.dialog-body li + li { margin-top: 5px; }
.dialog-body a { color: var(--cyan); }
.dialog-body .action-row { margin-top: 14px; }
.answers { display: grid; gap: 6px; margin: 8px 0; }
.answers button { text-align: left; padding: 6px 10px; }
.answers button.correct { border-color: var(--lime); color: var(--lime); }
.answers button.try-again { border-color: var(--rose); }
.reveal { background: #151b31; padding: 11px; border: 1px solid var(--edge); border-radius: 9px; }
.reveal > a { display: inline-block; margin-top: 5px; }
.stars { color: var(--gold); font-size: 31px; letter-spacing: .1em; }
.logbook { display: grid; gap: 6px; margin-top: 12px; }
.logbook details { border: 1px solid var(--edge); border-radius: 8px; padding: 6px 9px; }
.logbook details p { padding: 4px 0; }
.logbook summary { cursor: pointer; color: var(--purple); }
@media (max-width: 1020px) {
  .wrap { width: calc(100% - 32px); }
  .desk { grid-template-columns: minmax(0,1fr) 250px; }
}
@media (max-width: 740px) {
  .wrap { width: calc(100% - 20px); }
  .top-inner { min-height: 58px; gap: 5px; }
  .brand { gap: 6px; font-size: 14px; }
  .brand-emblem { width: 29px; height: 29px; font-size: 18px; }
  .top-actions { gap: 4px; }
  .top-actions button { min-height: 36px; font-size: 12px; padding-inline: 7px; }
  .top-actions .sound-toggle { width: 34px; font-size: 16px; }
  main { padding-top: 12px; }
  .intro { padding: 14px; gap: 7px; align-items: start; }
  .intro p { font-size: 12px; margin-top: 6px; }
  .progress-pill { padding: 4px 6px; font-size: 11px; }
  .planet { top: -30%; right: 2%; }
  .stats { margin: 8px 0; gap: 4px; }
  .stat { padding: 6px; gap: 5px; }
  .stat-mark { flex-basis: 22px; height: 25px; font-size: 14px; }
  .stat small { font-size: 10px; }
  .stat b { font-size: 15px; }
  .desk { grid-template-columns: 1fr; gap: 8px; }
  .side { gap: 8px; }
  .gear { padding: 8px; }
  .gear-heading { margin-bottom: 6px; }
  .build-list { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px; }
  .build-card { padding: 4px; gap: 5px; grid-template-columns: 26px minmax(0,1fr) auto; }
  .build-card .unit-mark { width: 25px; height: 27px; font-size: 18px; }
  .build-card small { font-size: 10px; }
  .build-name, .cost { font-size: 11px; }
  .research { padding: 8px; }
  .chapters { grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); }
  .board-foot { padding: 6px; }
  .board-foot p { font-size: 12px; }
  .board-foot .action-row { gap: 4px; }
  .board-foot button { padding-inline: 7px; }
  .board-foot .wide { min-width: 105px; }
  .bar { min-height: 38px; padding: 5px 8px; }
  .plan { padding: 7px; }
  .plan-zone { padding-inline: 4px; }
  .map-tag:not(.base) { transform: translate(-30%,-50%); }
  .map-tag.base { transform: translate(-70%,-50%); }
}
@media (max-width: 365px) {
  .board-control { --unit: 31px; }
  .brand { font-size: 13px; }
  .top-actions button { padding-inline: 5px; }
  .top-actions .sound-toggle { width: 30px; }
  .stat small { font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="brand"><span class="brand-emblem" aria-hidden="true">✦</span> 太空基地指挥官</div>
    <nav class="top-actions" aria-label="游戏菜单">
      <button id="help" type="button">玩法</button>
      <button id="jump" type="button">关卡</button>
      <button id="archive" class="archive" type="button">发现图鉴</button>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="游戏声音" aria-pressed="true" title="关闭游戏声音" hidden>🔊</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="intro" aria-labelledby="mission-title">
    <div class="planet" id="planet" aria-hidden="true"></div>
    <div>
      <div class="eyebrow" id="sector">月球前哨 · 第 01 关</div>
      <h1 id="mission-title">月面初登陆</h1>
      <p id="briefing">把机器人放到碎石航道旁，守住刚刚建好的月球基地。</p>
    </div>
    <div class="progress-pill"><strong aria-hidden="true">★</strong><span id="total-progress">0 / 60 星</span></div>
  </section>
  <section class="stats" aria-label="基地状态">
    <div class="stat" style="--tint:var(--gold)"><span class="stat-mark" aria-hidden="true">ϟ</span><div class="stat-data"><small>可用能量</small><b id="energy">100</b></div></div>
    <div class="stat" style="--tint:var(--cyan)"><span class="stat-mark" aria-hidden="true">⬡</span><div class="stat-data"><small>基地护盾</small><b id="shield">100</b><span class="meter" aria-hidden="true"><i id="shield-meter"></i></span></div></div>
    <div class="stat" style="--tint:var(--purple)"><span class="stat-mark" aria-hidden="true">≋</span><div class="stat-data"><small>已完成波次</small><b id="wave">0 <span>/ 2</span></b><span class="meter" aria-hidden="true"><i id="wave-meter"></i></span></div></div>
  </section>
  <div class="desk">
    <section class="panel board-panel" aria-labelledby="map-title">
      <header class="bar"><h2 id="map-title">基地地图</h2><span class="live-state" id="phase">布置时间</span></header>
      <div class="field" id="field">
        <canvas id="map" width="800" height="436" aria-hidden="true"></canvas>
        <div id="map-controls"></div>
      </div>
      <section id="plan" class="plan" aria-labelledby="plan-title">
        <div class="plan-head"><h3 id="plan-title">第 1 波布防</h3><b id="impact-plan"></b></div>
        <div id="plan-zones" class="plan-zones"></div>
        <p class="plan-note" id="plan-budget"></p>
      </section>
      <div class="board-foot">
        <p id="message" aria-live="polite">先选择激光机器人，再点地图上带「＋」的位置。</p>
        <div class="action-row">
          <button class="primary wide" type="button" id="start">核算能量并出发</button>
          <button type="button" id="speed" class="mini" aria-label="慢速节奏" aria-pressed="false">正常节奏</button>
          <button type="button" id="repair" class="mini">修复 · 25 能量</button>
          <button type="button" id="restart" class="mini secondary">重开</button>
        </div>
      </div>
    </section>
    <aside class="side" aria-label="指挥工具">
      <section class="panel gear">
        <div class="gear-heading"><h2>机器人工坊</h2><small id="build-slots"></small></div>
        <div class="build-list" id="build-list"></div>
        <div class="manage" id="manage" hidden>
          <p id="manage-label"></p>
          <div class="action-row">
            <button id="upgrade" type="button">升级</button>
            <button id="recycle" type="button">回收</button>
          </div>
        </div>
      </section>
      <section class="panel research">
        <button type="button" id="scan">
          <span class="unit-mark" aria-hidden="true">✧</span>
          <span><strong id="scan-title">扫描地图上的发现点</strong><small id="scan-subtitle">答对可得 25 能量</small></span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
      </section>
    </aside>
  </div>
  <section class="panel route" id="route" aria-labelledby="route-title">
    <div class="route-header"><h2 id="route-title">探索航线</h2><small id="route-progress">已通关 0 / 20</small></div>
    <div class="chapters" id="chapters"></div>

function noiseStream(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 2147483648 - 1;
  };
}

function mixNote(samples, start, length, note, volume, overtone = .12) {
  const frequency = 440 * 2 ** ((note - 69) / 12);
  const first = Math.round(start * SOUND_RATE);
  const count = Math.min(Math.round(length * SOUND_RATE), samples.length - first);
  for (let i = 0; i < count; i += 1) {
    const time = i / SOUND_RATE;
    const phase = 2 * Math.PI * frequency * time;
    const envelope = Math.min(1, time / .055) * (1 - i / count) ** 2;
    samples[first + i] += volume * envelope * (Math.sin(phase) + overtone * Math.sin(phase * 2));
  }
}

function makeBackground(context, name) {
  const hasMusic = typeof name === "number";
  const music = sectorMusic[name];
  const duration = hasMusic ? music.bass.length * music.bar : name === "battle" ? 3.6 : 8;
  const buffer = context.createBuffer(1, Math.round(SOUND_RATE * duration), SOUND_RATE);
  const samples = buffer.getChannelData(0);
  const random = noiseStream(hasMusic ? 817 + name : 391);
  let wind = 0;
  let texture = 0;
  if (name === "battle") {
    for (let beat = 0; beat < 8; beat += 1) {
      mixNote(samples, beat * .45, .29, beat % 2 ? 35 : 31, beat % 2 ? .05 : .088, .30);
    }
    return buffer;
  }
  for (let i = 0; i < samples.length; i += 1) {
    const white = random();
    const time = i / SOUND_RATE;
    wind += .015 * (white - wind);
    texture += .075 * (white - texture);
    const edge = Math.min(1, time * 5, (duration - time) * 5);
    const swell = .61 + .32 * Math.sin(4 * Math.PI * time / duration);
    samples[i] = hasMusic ? wind * music.air * swell * edge :
      (wind * .30 + (texture - wind) * .075) * swell * edge;
  }
  if (hasMusic) {
    music.bass.forEach((note, bar) => {
      const start = bar * music.bar;
      mixNote(samples, start, music.bar * .94, note, .105, music.color);
      mixNote(samples, start + .15, music.bar * .83, note + 7, .040, music.color);
      music.notes[bar].forEach((pitch, beat) => {
        const onset = start + .24 + music.bar * .76 * beat / music.notes[bar].length;
        const length = music.bar * (name === 3 || name === 4 ? .56 : .40);
        mixNote(samples, onset, length, pitch, .049, music.color);
        if (name === 3 || name === 4) mixNote(samples, onset + .19, length * .8, pitch, .015);
      });
    });
  }
  return buffer;
}

function connectBackground(audio, name, level) {
  const { context, music, buffers, tracks } = audio;
  if (!buffers.has(name)) buffers.set(name, makeBackground(context, name));
  const source = context.createBufferSource();
  const gain = context.createGain();
  gain.gain.value = 0;
  source.buffer = buffers.get(name);
  source.loop = true;
  source.connect(gain).connect(music);
  source.onended = () => { source.disconnect(); gain.disconnect(); };
  source.start();
  gain.gain.setTargetAtTime(level, context.currentTime, .22);
  tracks.set(name, { source, gain });
}

function syncGameAudio() {
  const audio = gameAudio;
  if (!audio || !session || audio.context.state === "closed") return;
  const audible = soundEnabled && !document.hidden;
  const battle = session.phase === "wave" && !popup.open;
  const dust = battle && isDustWave();
  const sector = Math.floor(session.index / 4);
  const duck = popup.open || session.phase === "paused" || isOver();
  const scene = [audible, sector, battle, dust, duck].join("/");
  if (scene === audio.scene) return;

  try {
    mixBackground(audio, audible, battle, dust, sector, duck);
    audio.scene = scene;
  } catch {
    releaseGameAudio(audio);
  }
}

function mixBackground(audio, audible, battle, dust, sector, duck) {
  const { context, volume, music, tracks } = audio;
  const now = context.currentTime;
  volume.gain.setTargetAtTime(audible ? .73 : 0, now, audible ? .10 : .012);
  music.gain.setTargetAtTime(duck ? .32 : .73, now, .15);
  const levels = new Map();
  if (audible) {
    levels.set(sector, battle ? .52 : .84);
    if (battle) levels.set("battle", .46);
    if (dust) levels.set("dust", .69);
  } else {
    audio.pending = null;
  }

  for (const [name, { source, gain }] of tracks) {
    const level = levels.get(name);
    gain.gain.setTargetAtTime(level ?? 0, now, .19);
    if (level === undefined) {
      source.stop(now + .78);
      tracks.delete(name);
    }
  }
  for (const [name, level] of levels) {
    if (!tracks.has(name)) connectBackground(audio, name, level);
  }
}

function releaseGameAudio(audio) {
  if (gameAudio !== audio) return;
  gameAudio = undefined;
  if (audio.context.state !== "closed") audio.context.close().catch(() => {});
}

function playEnvelope(context, output, source, now, duration, loudness, extraNode) {
  const gain = context.createGain();
  const floor = .0001;
  gain.gain.setValueAtTime(floor, now);
  gain.gain.exponentialRampToValueAtTime(loudness, now + .014);
  gain.gain.exponentialRampToValueAtTime(floor, now + duration);
  (extraNode || source).connect(gain).connect(output);
  if (extraNode) source.connect(extraNode);
  source.onended = () => { source.disconnect(); extraNode?.disconnect(); gain.disconnect(); };
  source.start(now);
  source.stop(now + duration);
}

function playSound(name, delay = 0) {
  const audio = gameAudio;
  const cue = soundCues[name];
  if (!audio || !cue || !soundEnabled || document.hidden || audio.context.state === "closed") return;
  const { context, lastSound } = audio;
  if (context.state !== "running") {
    if (audio.resuming) audio.pending = { name, delay, time:performance.now() };
    return;
  }
  const now = context.currentTime + delay;
  if (now - (lastSound.get(name) ?? -1) < (cue.gap ?? .065)) return;
  lastSound.set(name, now);
  try {
    emitCue(audio, cue, now);
  } catch {
    releaseGameAudio(audio);
  }
}

function emitCue(audio, cue, now) {
  const { context, effects } = audio;
  for (const [waveform, frequency, end, offset, duration, level] of cue.tones) {
    const tone = context.createOscillator();
    tone.type = waveform;
    tone.frequency.setValueAtTime(frequency, now + offset);
    tone.frequency.exponentialRampToValueAtTime(end, now + offset + duration);
    playEnvelope(context, effects, tone, now + offset, duration, level);
  }
  if (cue.noise) {
    if (!audio.noise) {
      const buffer = context.createBuffer(1, SOUND_RATE, SOUND_RATE);
      const samples = buffer.getChannelData(0);
      const random = noiseStream(501);
      for (let i = 0; i < samples.length; i += 1) samples[i] = random();
      audio.noise = buffer;
    }
    const [frequency, duration, level] = cue.noise;
    const grit = context.createBufferSource();
    grit.buffer = audio.noise;
    const filter = context.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(frequency, now);
    playEnvelope(context, effects, grit, now, duration, level, filter);
  }
}

function wakeGameAudio() {
  if (!AudioEngine || !soundEnabled || document.hidden) return;
  try {
    if (!gameAudio || gameAudio.context.state === "closed") {
      const context = new AudioEngine();
      const volume = context.createGain();
      const music = context.createGain();
      const effects = context.createGain();
      const compressor = context.createDynamicsCompressor();
      compressor.threshold.value = -17;
      compressor.ratio.value = 4;
      volume.gain.value = 0;
      music.gain.value = .73;
      effects.gain.value = .85;
      music.connect(volume);
      effects.connect(volume);
      volume.connect(compressor).connect(context.destination);
      gameAudio = { context, volume, music, effects, tracks:new Map(), buffers:new Map(), lastSound:new Map() };
    }
    const audio = gameAudio;
    if (audio.context.state === "running") {
      syncGameAudio();
    } else if (!audio.resuming) {
      audio.resuming = true;
      audio.context.resume().then(() => {
        if (gameAudio !== audio) return;
        const cue = audio.pending;
        audio.pending = null;
        syncGameAudio();
        if (cue && performance.now() - cue.time < 350) playSound(cue.name, cue.delay);
      }).catch(() => {
        audio.pending = null;
      }).finally(() => {
        audio.resuming = false;
      });
    }
  } catch {
    // The game remains playable if an audio device is unavailable.
  }
}

function bindSoundControls() {

function loadProgress() {
  const empty = { stars: {}, scans: {}, strategy: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    for (let index = 0; index < missions.length; index += 1) {
      const stars = saved?.stars?.[index];
      if (Number.isInteger(stars) && stars >= 1 && stars <= 3) empty.stars[index] = stars;
      if (saved?.scans?.[index] === true) empty.scans[index] = true;
      if (saved?.strategy?.[index] === true) empty.strategy[index] = true;
    }
  } catch {
    // A privacy setting or malformed save leaves a fresh in-memory game.
  }
  return empty;
}

function saveProgress() {
  try {

function makeMap(index) {
  const layout = layouts[Math.floor(index / 2)];
  const orient = ([x, y]) => ({ x, y: index % 2 ? HEIGHT - y : y });
  const path = layout.path.map(orient);
  let length = 0;
  const segments = path.slice(1).map((to, i) => {
    const from = path[i];
    const size = Math.hypot(to.x - from.x, to.y - from.y);
    const segment = { from, to, size, start: length };
    length += size;
    return segment;
  });
  const pads = layout.pads.map((point, i) => ({
    ...orient(point), zone:zones.findIndex((zone) => point[0] < zone.edge), shaded:[1, 3, 6].includes(i)
  }));
  const gates = zones.map(({gate}) => {
    const segment = segments.find(({from,to}) => from.x <= gate && gate <= to.x && from.x < to.x);
    return segment.start + gate - segment.from.x;
  });
  return { path, segments, length, pads, gates, scan:orient(layout.scan) };
}

  const totalStars = Object.values(progress.stars).reduce((total, rating) => total + rating, 0);
  byId("total-progress").textContent = totalStars + " / 60 星";
  byId("route-progress").textContent = "策略通关 " + Object.keys(progress.strategy).length + " / 20";
  byId("chapters").replaceChildren(...chapters.map((chapter, chapterIndex) => {
    const card = document.createElement("section");
    card.className = "chapter" + (chapterIndex === Math.floor(session.index / 4) ? " current" : "");
    card.style.setProperty("--mark", chapter.mark);
    const title = document.createElement("h3");
    title.textContent = chapter.name;
    const list = document.createElement("div");
    list.className = "chapter-levels";
    for (let i = chapterIndex * 4; i < chapterIndex * 4 + 4; i += 1) {
      const button = document.createElement("button");
      const rating = progress.stars[i] || 0;
      button.type = "button";
      button.disabled = !unlocked(i);
      button.title = missions[i].name;
      button.setAttribute("aria-label", "第 " + (i + 1) + " 关 " + missions[i].name +
        (button.disabled ? "，待解锁" : "，" + rating + " 星"));
      if (i === session.index) button.setAttribute("aria-current", "step");
      button.innerHTML = (i + 1) + "<small aria-hidden='true'>" +
        (progress.strategy[i] ? "✓ " : "") + (rating ? "★".repeat(rating) : button.disabled ? "◇" : "·") + "</small>";
      button.addEventListener("click", () => {
        if (i === session.index) {
          window.scrollTo({ top:0, behavior:motion.matches ? "auto" : "smooth" });
          return;
        }
        if (!isOver() && (session.complete || session.phase !== "prep" || session.built.size)) {
          confirmAction("切换关卡？", "当前波次和布置会重新开始，已记录的星星和图鉴会保留。", "前往第 " + (i + 1) + " 关", () => goTo(i));
          return;
        }
        goTo(i);
      });
      list.append(button);
    }
    card.append(title, list);
    return card;
  }));
}

function render() {
  const { mission, energy, shield, complete, phase, inspected, scanned } = session;
  const planning = phase === "prep";
  byId("build-slots").textContent = "工位 " + session.built.size + " / " + session.rules.slots;
  byId("energy").textContent = energy;
  byId("shield").textContent = shield;
  byId("shield-meter").style.width = shield + "%";
  byId("wave").innerHTML = complete + " <span>/ " + mission.waves.length + "</span>";
  byId("wave-meter").style.width = 100 * complete / mission.waves.length + "%";
  const phaseText = { prep:"布置时间", wave:"拦截中", paused:"已暂停", won:"任务完成", lost:shield === 0 ? "护盾耗尽" : "防守失败" };
  const dusty = isDustWave() && (phase === "wave" || phase === "paused");
  const phaseDetail = dusty ? " · 尘暴" : "";
  byId("field").classList.toggle("dust", dusty);
  byId("phase").textContent = phaseText[phase] + phaseDetail;
  const start = byId("start");
  start.textContent = {
    prep:"核算能量并出发", wave:"Ⅱ 暂停拦截", paused:"▶ 继续拦截",
    won:session.index === missions.length - 1 ? "查看完成记录" : "前往下一关", lost:"再试一次"
  }[phase];
  byId("repair").disabled = !planning || shield === 100 || energy < REPAIR_COST;
  scanPin.disabled = byId("scan").disabled = !planning && !isOver();
  byId("speed").textContent = slow ? "慢速节奏" : "正常节奏";
  byId("speed").setAttribute("aria-pressed", String(slow));
  if (!session.lastScanRender || session.lastScanRender !== String(scanned)) {
    scanPin.className = "board-control scan-pin" + (scanned ? " found" : "");
    scanPin.textContent = scanned ? "✓" : "✧";
    scanPin.setAttribute("aria-label", (scanned ? "查看" : "扫描") + mission.point);
    byId("scan-title").textContent = scanned ? "已发现 · " + mission.point : "扫描地图上的发现点";
    byId("scan-subtitle").textContent = scanned ? "点开重读科学记录" : "答对可得 " + SCAN_REWARD + " 能量";
    session.lastScanRender = String(scanned);
  }
  for (const [type, button] of robotButtons) {
    const robot = robots[type];
    const available = session.index >= robot.unlock;
    const label = available ? robot.desc : "第 " + (robot.unlock + 1) + " 关解锁";
    button.disabled = !available || !planning;
    button.setAttribute("aria-pressed", String(session.selected === type));
    button.classList.toggle("unaffordable", energy < robot.cost);
    if (button.querySelector("small").textContent !== label) button.querySelector("small").textContent = label;
  }
  for (const [i, button] of padButtons.entries()) {
    const bot = session.built.get(i);
    const pad = session.map.pads[i];
    const terrainClass = pad.shaded ? "shade-empty" : "sun-empty";
    const showSun = mission.rule === "shade" && (!bot || bot.type === "solar");
    const selected = session.selected && energy >= robots[session.selected].cost;
    const className = "board-control " + (bot ? "placed " : selected ? "is-ready " : "") + (showSun ? terrainClass : "");
    if (button.className !== className) button.className = className;
    button.setAttribute("aria-pressed", String(i === inspected));
    button.disabled = !planning;
    const zone = zones[pad.zone];
    button.style.setProperty("--zone-color", zone.color);
    const content = '<span class="pad-zone" aria-hidden="true">' + zone.code + '</span>' +
      (bot ? robots[bot.type].glyph + '<span class="bot-level">' + bot.level + '</span>' : "＋");
    if (button.dataset.content !== content) {
      button.innerHTML = content;
      button.dataset.content = content;
    }
    if (bot) button.style.setProperty("--bot", robots[bot.type].color);
    button.setAttribute("aria-label", zone.code + " " + zone.name + "，建造位 " + (i + 1) + (showSun ? (pad.shaded ? "，月影" : "，有阳光") : "") +
      (bot ? "，" + robots[bot.type].name + " " + bot.level + " 级" : "，空位"));
  }
  const bot = session.built.get(inspected);
  byId("manage").hidden = !bot || !planning;
  if (bot) {
    const robot = robots[bot.type];
    const cost = upgradeCost(bot);
    const output = bot.type === "solar" ? "发电 " + solarYield(bot) : "基础火力 " + (robot.power + (bot.level - 1) * 2);
    byId("manage-label").textContent = robot.name + " · " + bot.level + " 级 · " + output +
      " · 启动 " + activationFee(bot) + " 能量";
    byId("upgrade").textContent = bot.level >= 3 ? "已满级" : "升级 · " + cost;
    byId("upgrade").disabled = bot.level >= 3 || session.energy < cost;
    byId("recycle").textContent = "回收 · +" + Math.floor(bot.spent * .65);
  }
  renderPlan();
  drawBoard();
  syncGameAudio();
}

function upgradeCost(bot) {
  return Math.ceil(robots[bot.type].cost * (bot.level === 1 ? .7 : .95));
}

function selectPad(index) {
  if (session.phase !== "prep") return;
  const bot = session.built.get(index);
  if (bot) {
    session.inspected = index;
    session.selected = null;
    playSound("select");
    say(robots[bot.type].name + " 已选中。点空位可免费移动，也可在工坊升级。");
  } else {
    const type = session.selected;
    if (!type) {
      const moving = session.built.get(session.inspected);
      if (moving) {
        session.built.delete(moving.index);
        moving.index = index;
        session.built.set(index, moving);
        session.inspected = index;
        playSound("move");
        say("已免费移动到 " + zones[session.map.pads[index].zone].code + " 航段。看看拦截计划有什么变化。");
        render();
        return;
      }
      playSound("reject");
      say("先在机器人工坊选一张卡片，再点地图上的「＋」。");
      return;
    }
    if (session.built.size >= session.rules.slots) {
      playSound("reject");
      say("工位已满。点已有机器人，可以移动、升级或回收。");
      return;
    }
    const robot = robots[type];
    if (session.energy < robot.cost) {
      playSound("reject");
      say("能量还差 " + (robot.cost - session.energy) + "。扫描发现点或拦截碎石可以补给。");
      return;
    }
    session.energy -= robot.cost;
    session.built.set(index, { type, index, level:1, spent:robot.cost });
    session.inspected = index;
    playSound("build");
    say(robot.name + " 就位！" + (session.phase === "prep" ? "准备好后就开始下一波。" : ""));
  }
  render();
}

function isDustWave() {
  return session.mission.rule === "dust" && session.complete === 1;
}

function solarYield(bot) {
  let output = 12 + (bot.level - 1) * 4;
  if (session.mission.rule === "shade" && session.map.pads[bot.index].shaded) output -= 9;
  if (isDustWave() || session.mission.rule === "dim") output -= 6;
  return output;
}

function positionOnPath(distance) {
  const segment = session.map.segments.find((item) => distance <= item.start + item.size);
  if (!segment) return session.map.path.at(-1);
  const portion = (distance - segment.start) / segment.size;
  return {
    x:segment.from.x + (segment.to.x - segment.from.x) * portion,
    y:segment.from.y + (segment.to.y - segment.from.y) * portion
  };
}

function activationFee(bot) {
  return robots[bot.type].fee + bot.level - 1;
}

function powerAgainst(bot, type) {
  const heavy = type === "h" || type === "b";
  let power = robots[bot.type].power + (bot.level - 1) * 2;
  if (bot.type === "frost" && type === "r") power += 4;
  if (bot.type === "pulse" && heavy) power += 3;
  if (bot.type === "beam" && heavy) power -= 1;
  return power;
}

function wavePlan() {
  const { mission, rules, built, map, complete } = session;
  const pattern = rules.patterns[complete];
  const bots = [...built.values()];
  const defenders = zones.map((zone, i) => bots.filter((bot) => bot.type !== "solar" && map.pads[bot.index].zone === i));
  const targets = [...mission.waves[complete]].map((type, i) => {
    const zone = pattern.charCodeAt(i % pattern.length) - 65;
    const required = debris[type].health +
      Number((mission.rule === "armor" && type === "h") || (mission.rule === "fast" && type === "r"));
    const power = defenders[zone].reduce((sum, bot) => sum + powerAgainst(bot, type), 0);
    return { type, zone, required, power };
  });
  const fee = bots.reduce((sum, bot) => sum + activationFee(bot), 0);
  const solar = bots.filter((bot) => bot.type === "solar").reduce((sum, bot) => sum + solarYield(bot), 0);
  const impact = targets.reduce((sum, target) => sum + (target.power < target.required ? debris[target.type].impact : 0), 0);
  return { defenders, targets, bots, fee, solar, impact, limit:rules.impacts[complete] };
}

function uncoveredZones(plan) {
  const missing = new Set(plan.targets.filter(target => target.power < target.required).map(target => target.zone));
  return [...missing].sort().map(index => zones[index].code).join("、");
}

function renderPlan() {
  byId("plan").hidden = isOver();
  if (isOver() || session.phase !== "prep") return;
  const plan = wavePlan();
  byId("plan-title").textContent = "第 " + (session.complete + 1) + " 波布防";
  const risk = byId("impact-plan");
  risk.textContent = "预计冲击 " + plan.impact + " / 上限 " + plan.limit;
  risk.style.color = plan.impact <= plan.limit ? "var(--cyan)" : "var(--rose)";
  byId("plan-zones").innerHTML = zones.map((zone, i) => {
    const units = plan.defenders[i];
    const basePower = units.map((bot) => robots[bot.type].power + (bot.level - 1) * 2);
    const sum = basePower.reduce((total, power) => total + power, 0);
    const threats = plan.targets.filter((target) => target.zone === i);
    const rows = Object.entries(debris).map(([type, rock]) => {
      const incoming = threats.filter((target) => target.type === type);
      if (!incoming.length) return "";
      const { power, required } = incoming[0];
      const covered = power >= required;
      const status = covered ? "met" : "short";
      const change = power - sum;
      const bonus = change ? '<small>' + (change > 0 ? "加成 +" : "折减 ") + change + "</small>" : "";
      const impact = covered ? "" : '<small> · ' + incoming.length + " × " + rock.impact +
        " = " + incoming.length * rock.impact + " 冲击</small>";
      return '<p class="' + status + '">' + incoming.length + "×" + rock.name +
        " · " + power + " / " + required + " 火力" + (bonus || impact ? "<br>" + bonus + impact : "") + "</p>";
    }).join("");
    return '<section class="plan-zone" style="--zone-color:' + zone.color + '"><h4>' +
      zone.code + " " + zone.name + "<small>基础火力 " +
      (basePower.length > 1 ? basePower.join(" + ") + " = " : "") + sum + "</small></h4>" +
      (rows || "<p>本波无来袭</p>") + "</section>";
  }).join("");
  const goal = session.rules.solar ? " / 目标 " + session.rules.solar : "";
  const supply = plan.solar || session.rules.solar ? " · 本波发电 " + plan.solar + goal : "";
  byId("plan-budget").textContent = "启动 " + plan.fee + " 能量 · 启动后至少留 " + session.rules.reserve + supply;
}

function openWave() {
  const plan = wavePlan();
  if (plan.solar < session.rules.solar) {
    playSound("reject");
    say("这一波至少要发电 " + session.rules.solar + "。试试把太阳能机器人移到有阳光的位置，或给它升级。");
    return;
  }
  const expected = session.energy - plan.fee;
  if (expected < session.rules.reserve) {
    playSound("reject");
    say("付完启动费后还差 " + (session.rules.reserve - expected) + " 能量。试试扫描、用更少的机器人或回收一台。");
    return;
  }

  const form = document.createElement("form");
  form.className = "launch-form";
  const risk = plan.impact > plan.limit || plan.impact >= session.shield;
  const warning = risk ? '<p class="launch-warning"><strong>' + uncoveredZones(plan) + ' 航段火力不足。</strong> ' +
    '预计冲击 ' + plan.impact + '，本波上限 ' + plan.limit + '。' +
    (plan.impact >= session.shield ? '预计会耗尽护盾。' : '') + '超出上限，这一波就失败。' +
    '可以返回移动机器人，也可以开波观察。</p>' : '';
  const counts = new Map();
  for (const bot of plan.bots) {
    const fee = activationFee(bot);
    counts.set(fee, (counts.get(fee) || 0) + 1);
  }
  const terms = [...counts].map(([fee, count]) => count === 1 ? String(fee) : count + " × " + fee);
  const equation = terms.length > 1 ? "(" + terms.join(" + ") + ")" : terms[0] || "0";
  form.innerHTML = warning + '<p>库存 <b>' + session.energy + '</b>。付完启动费，基地至少要留 <b>' +
    session.rules.reserve + '</b> 能量。</p><label for="energy-answer">开波后还剩几格能量？</label>' +
    '<p class="reveal">' + session.energy + " − " + equation + ' = ?</p>' +
    '<input id="energy-answer" name="energy" type="text" inputmode="numeric" pattern="[0-9]+" required autocomplete="off">' +
    '<p class="launch-feedback" aria-live="polite"></p>' +
    '<div class="action-row"><button type="button" class="return-to-plan">返回布防</button>' +
    '<button type="submit" class="primary">' + (risk ? '开波观察' : '确认启动') + '</button></div>';
  form.querySelector('.return-to-plan').addEventListener('click', () => popup.close());
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const input = form.elements.energy;
    const feedback = form.querySelector(".launch-feedback");
    if (Number(input.value) !== expected) {
      playSound("reject");
      feedback.textContent = "启动费共 " + plan.fee + "。用 " + session.energy + " 减去 " + plan.fee + " 再试一次。";
      input.select();
      return;
    }
    popup.close();
    session.energy = expected;
    session.activePlan = plan;
    session.phase = "wave";
    session.nextRock = 0;
    session.spawnIn = .55;
    session.waveStartShield = session.shield;
    playSound("launch");
    say("启动费 −" + plan.fee + "，剩余 " + expected + " 能量。观察各航段怎样拦截碎石。");
    render();
  });
  openDialog("核对启动能量", form);
  playSound("select");
  form.elements.energy.focus();
}

function spawnRock(target) {
  const { type, required } = target;
  session.rocks.push({
    ...target, hp:required, max:required, distance:0, frozen:0, fired:false,
    spin:(session.nextRock * .78) % (Math.PI * 2), point:session.map.path[0]
  });
}

function intercept(rock) {
  rock.fired = true;
  const defenders = session.activePlan.defenders[rock.zone];
  rock.hp -= rock.power;
  if (rock.type === "r" && defenders.some((bot) => bot.type === "frost")) rock.frozen = 1.2;
  for (const type of new Set(defenders.map((bot) => bot.type))) playSound(type);
  for (const bot of defenders) {
    session.effects.push({
      kind:"ray", from:session.map.pads[bot.index], to:rock.point,
      color:robots[bot.type].color, life:.26
    });
  }
}

function tick(delta) {
  const energy = session.energy;
  const shield = session.shield;
  const wave = session.activePlan.targets;
  session.spawnIn -= delta;
  if (session.nextRock < wave.length && session.spawnIn <= 0) {
    if (session.nextRock === 0 || wave[session.nextRock].type === "b") playSound("incoming");
    spawnRock(wave[session.nextRock]);
    session.nextRock += 1;
    session.spawnIn += session.index >= 8 && session.nextRock % 3 !== 0 ? .52 : .87;
  }
  for (const rock of session.rocks) {
    rock.frozen = Math.max(0, rock.frozen - delta);
    const speedBonus = rock.type === "r" && session.mission.rule === "fast" ? 1.15 : 1;
    rock.distance += debris[rock.type].speed * speedBonus * (rock.frozen ? .65 : 1) * delta;
    rock.point = positionOnPath(rock.distance);
    if (!rock.fired && rock.distance >= session.map.gates[rock.zone]) intercept(rock);
  }
  session.rocks = session.rocks.filter((rock) => {
    const kind = debris[rock.type];
    if (rock.hp <= 0) {
      session.energy += kind.bounty;
      playSound("rockBreak", .09);
      session.effects.push({ kind:"gain", from:rock.point, text:"+" + kind.bounty, color:"#daff8f", life:.7 });
      return false;
    }
    if (rock.distance < session.map.length) return true;
    session.shield = Math.max(0, session.shield - kind.impact);
    playSound("shieldHit");
    session.effects.push({ kind:"gain", from:rock.point, text:"−" + kind.impact, color:"#ff9caa", life:.8 });
    return false;
  });
  session.effects = session.effects.filter((effect) => (effect.life -= delta) > 0);

  if (session.shield === 0) {
    session.phase = "lost";
    playSound("defeat", .19);
    say("碎石击穿了护盾。看看哪个航段漏过了碎石，再试着调整布置。");
    render();
    openResult();
    return;
  }
  if (session.rocks.length === 0 && session.nextRock === wave.length) {
    endWave();
    return;
  }
  if (energy !== session.energy || shield !== session.shield) render();
}

function awardStars() {
  const stars = 1 + Number(session.shield >= 65) + Number(session.scanned);
  progress.stars[session.index] = Math.max(progress.stars[session.index] || 0, stars);
  saveProgress();
  return stars;
}

function endWave() {
  const { solar, limit } = session.activePlan;
  const impact = session.waveStartShield - session.shield;
  if (impact > limit) {
    session.phase = "lost";
    playSound("defeat", .19);
    say("本波实际冲击 " + impact + "，超过上限 " + limit + "。看看哪个航段漏过了碎石。");
    render();
    openResult();
    return;
  }
  session.energy += solar;
  session.complete += 1;
  session.effects = [];
  if (session.complete === session.mission.waves.length) {
    session.phase = "won";
    playSound("victory", .16);
    progress.strategy[session.index] = true;
    awardStars();
    renderProgress();
    render();
    say("基地守住了！你可以前往下一关，或继续调查这个发现点。");
    openResult();
    return;
  }
  session.phase = "prep";
  session.energy += WAVE_ALLOWANCE;
  playSound("waveClear", .16);
  if (solar) playSound("solar", .68);
  const weather = isDustWave() ? " 下一波有尘暴。" : "";
  say("本波冲击 " + impact + "，补给 +" + WAVE_ALLOWANCE +
    (solar ? "，发电 +" + solar : "") + "。" + weather + " 看看下一波要守哪些航段。");
  render();
}

function openDialog(title, content) {
  byId("dialog-title").textContent = title;
  dialogBody.replaceChildren();
  if (typeof content === "string") dialogBody.innerHTML = content;
  else dialogBody.append(content);
  if (!popup.open) popup.showModal();
  syncGameAudio();
}

function confirmAction(title, message, accept, action) {
  openDialog(title, "<p>" + message + "</p>");
  const buttons = document.createElement("div");
  buttons.className = "action-row";
  const confirm = document.createElement("button");
  confirm.type = "button";
  confirm.className = "primary";
  confirm.textContent = accept;
  confirm.addEventListener("click", action, { once:true });
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "取消";
  cancel.addEventListener("click", () => popup.close());
  buttons.append(confirm, cancel);
  dialogBody.append(buttons);
}

function scienceRecord(mission) {
  const [name, url] = sources[mission.source];
  const record = document.createElement("div");
  record.className = "reveal";
  const fact = document.createElement("p");
  fact.textContent = mission.fact;
  const link = document.createElement("a");
  link.href = url;
  link.rel = "noopener noreferrer";
  link.target = "_blank";
  link.textContent = "NASA · " + name + " ↗";
  record.append(fact, link);
  return record;
}

function openDiscovery() {
  if (session.phase !== "prep" && !isOver()) return;
  playSound("scan");
  const { mission } = session;
  const content = document.createElement("div");
  const clue = document.createElement("p");
  clue.textContent = mission.clue;
  content.append(clue);
  if (session.scanned) {
    content.append(scienceRecord(mission));
  } else {
    const title = document.createElement("h3");
    title.textContent = mission.question;
    const choices = document.createElement("div");
    choices.className = "answers";
    const feedback = document.createElement("p");
    feedback.setAttribute("aria-live", "polite");
    mission.choices.forEach((choice, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = choice;
      button.addEventListener("click", () => {
        if (session.scanned) return;
        if (i !== mission.correct) {
          playSound("reject");
          button.classList.add("try-again");
          feedback.textContent = "再读一下上面的观测线索，试试其他选项。";
          return;
        }
        session.scanned = true;
        playSound("discover");
        progress.scans[session.index] = true;
        if (session.phase === "won") {
          awardStars();
          renderProgress();
        } else {
          saveProgress();
        }
        if (!isOver()) session.energy += SCAN_REWARD;
        for (const answer of choices.children) {
          answer.classList.remove("try-again");
          answer.setAttribute("aria-disabled", "true");
        }
        button.classList.add("correct");
        feedback.textContent = isOver() ? "答对了！发现已加入图鉴。" : "答对了！获得 " + SCAN_REWARD + " 能量，发现已加入图鉴。";
        content.append(scienceRecord(mission));
        render();
      });
      choices.append(button);
    });
    content.append(title, choices, feedback);
  }
  openDialog("扫描 · " + mission.point, content);
}

function openLogbook() {
  const content = document.createElement("div");
  const intro = document.createElement("p");
  const count = Object.keys(progress.scans).length;
  intro.textContent = "已发现 " + count + " / 20 个科学记录。" + (count ? "" : " 去扫描地图上闪亮的「✧」，第一张卡片就在月球。");
  const list = document.createElement("div");
  list.className = "logbook";
  missions.forEach((mission, i) => {
    if (!progress.scans[i]) return;
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = levelNumber(i) + " · " + mission.point;
    details.append(summary, scienceRecord(mission));
    list.append(details);
  });
  content.append(intro, list);
  openDialog("发现图鉴", content);
}

function openResult() {
  const won = session.phase === "won";
  const final = session.index === missions.length - 1;
  const stars = won ? 1 + Number(session.shield >= 65) + Number(session.scanned) : 0;
  let detail;
  if (won) {
    detail = "守住了基地，护盾剩余 " + session.shield + "。" +
      (session.scanned ? " 这关的发现已加入图鉴。" : " 扫描发现点还可以拿到一颗星。");
  } else {
    const plan = session.activePlan;
    const impact = session.waveStartShield - session.shield;
    const reason = session.shield === 0 ? "基地护盾耗尽。" : "实际冲击 " + impact + "，超过本波上限 " + plan.limit + "。";
    detail = "第 " + (session.complete + 1) + " 波防守失败。" + reason + " 下次试着给 " +
      uncoveredZones(plan) + " 航段加火力。点已有机器人，再点空位就能免费移动。";
  }
  const allCleared = Object.keys(progress.strategy).length === missions.length;
  const title = won ? (allCleared ? "20 关策略挑战全部完成！" : "基地安全！") : "再试一次，指挥官";
  openDialog(title, (won ? '<p class="stars" aria-label="' + stars + ' 星">' + "★".repeat(stars) + "☆".repeat(3 - stars) + "</p>" : "") + "<p>" + detail + "</p>");
  const buttons = document.createElement("div");
  buttons.className = "action-row";
  const next = document.createElement("button");
  next.type = "button";
  next.className = "primary";
  next.textContent = won ? (final ? "打开图鉴" : "前往第 " + (session.index + 2) + " 关") : "重新布置";
  next.addEventListener("click", () => {
    if (won && final) openLogbook();
    else goTo(won ? session.index + 1 : session.index);
  });
  const map = document.createElement("button");
  map.type = "button";
  map.textContent = "返回地图";
  map.addEventListener("click", () => popup.close());
  buttons.append(next, map);
  dialogBody.append(buttons);
}

function goTo(index) {
  beginMission(index);
  window.scrollTo({ top:0, behavior:motion.matches ? "auto" : "smooth" });
}

function restartMission() {
  const index = session.index;
  if (isOver() || (session.phase === "prep" && !session.built.size && !session.complete && !session.scanned)) {
    goTo(index);
  } else {
    confirmAction("重新布置这一关？", "会清空这一关的机器人工位和波次。获得的星星和图鉴会保留。", "重新开始", () => goTo(index));
  }
}

function explainGame() {
  openDialog("指挥官手册",
    "<ol><li>看布防表。每块碎石经过指定航段的信标时，该段机器人合力拦截。火力达到要求就能挡住。</li>" +
    "<li>选机器，再点航段里的「＋」。点已有机器再点空位可免费移动。升级火力加 2，启动费也加 1。</li>" +
    "<li>发电和启动后的能量达到要求时，算出「库存 − 启动费」就能开波。布防有缺口时，也可以开波观察。实际冲击超出上限，或护盾耗尽，本次防守就失败。</li>" +
    "<li>波次之间可以重排。花 25 能量修复最多 30 护盾，或扫描「✧」答题获得 25 能量。</li></ol>" +
    '<p class="reveal">守完全部波次得 1 星。护盾还剩 65 或更多、答对扫描题，各加 1 星。' +
    "你的最高星级和图鉴会保存在当前浏览器。机器人和碎石拦截规则属于游戏设定。</p>");
}

function trail(context, points) {
  context.beginPath();
  context.moveTo(points[0].x, points[0].y);
  for (const point of points.slice(1)) context.lineTo(point.x, point.y);
}

function circle(context, x, y, radius, color) {
  context.beginPath();
  context.arc(x, y, radius, 0, Math.PI * 2);
  context.fillStyle = color;
  context.fill();
}

function drawLandscape() {
  const { chapter, map, index } = session;
  let seed = 1949 + index * 121;
  const random = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const background = terrain.createLinearGradient(0, 0, WIDTH * .6, HEIGHT);
  background.addColorStop(0, chapter.sky);
  background.addColorStop(1, chapter.land);
  terrain.fillStyle = background;
  terrain.fillRect(0, 0, WIDTH, HEIGHT);

  for (let i = 0; i < 265; i += 1) {
    const x = random() * WIDTH;
    const y = random() * HEIGHT;
    const radius = i % 21 === 0 ? 1.9 : .4 + random() * .75;
    circle(terrain, x, y, radius, i % 21 === 0 ? chapter.line + "a6" : chapter.line + "36");
  }
  terrain.strokeStyle = chapter.line + "19";
  terrain.lineWidth = 1;
  for (let x = 0; x <= WIDTH; x += 24) {
    terrain.beginPath();
    terrain.moveTo(x, 0);
    terrain.lineTo(x, HEIGHT);
    terrain.stroke();
  }
  for (let y = 0; y <= HEIGHT; y += 24) {
    terrain.beginPath();
    terrain.moveTo(0, y);
    terrain.lineTo(WIDTH, y);
    terrain.stroke();
  }
  for (let i = 0; i < 30; i += 1) {
    const x = random() * WIDTH;
    const y = random() * HEIGHT;
    const radius = 7 + random() * 18;
    const depth = radius * .55;
    terrain.beginPath();
    terrain.ellipse(x, y, radius, depth, -.24, 0, Math.PI * 2);
    terrain.fillStyle = "#0b122958";
    terrain.fill();
    terrain.strokeStyle = chapter.stone + "37";
    terrain.lineWidth = 2;
    terrain.stroke();
    terrain.beginPath();
    terrain.ellipse(x, y - 2, radius - 3, depth - 2, -.24, .2, Math.PI * .94);
    terrain.strokeStyle = chapter.stone + "30";
    terrain.stroke();
  }
  for (const y of [0, HEIGHT]) {
    const sign = y ? -1 : 1;
    terrain.fillStyle = chapter.stone + "27";
    terrain.beginPath();
    terrain.moveTo(0, y);
    for (let x = 0; x <= WIDTH; x += 20) terrain.lineTo(x, y + sign * (9 + random() * 21));
    terrain.lineTo(WIDTH, y);
    terrain.closePath();
    terrain.fill();
  }
  if (index >= 12 && index <= 15) {
    terrain.strokeStyle = "#a2fbff4d";
    terrain.lineWidth = 1.4;
    trail(terrain, [{ x:0,y:209 }, { x:103,y:260 }, { x:199,y:194 }, { x:292,y:258 }, { x:398,y:188 }, { x:500,y:257 }, { x:641,y:178 }, { x:800,y:241 }]);
    terrain.stroke();
  }
  terrain.lineCap = "round";
  terrain.lineJoin = "round";
  trail(terrain, map.path);
  terrain.lineWidth = 52;
  terrain.strokeStyle = "#0d132b83";
  terrain.stroke();
  terrain.lineWidth = 42;
  terrain.strokeStyle = chapter.path;
  terrain.stroke();
  terrain.lineWidth = 34;
  terrain.strokeStyle = chapter.land + "9c";
  terrain.stroke();
  terrain.save();
  terrain.lineWidth = 2;
  terrain.setLineDash([5, 9]);
  terrain.strokeStyle = chapter.line + "ad";
  terrain.stroke();
  terrain.restore();

  for (const { from, to } of map.segments) {
    const x = (from.x + to.x) / 2;
    const y = (from.y + to.y) / 2;
    terrain.save();
    terrain.translate(x, y);
    terrain.rotate(Math.atan2(to.y - from.y, to.x - from.x));
    terrain.fillStyle = chapter.path;
    terrain.fillRect(-9, -9, 18, 18);
    trail(terrain, [{ x:-3,y:-4 }, { x:2,y:0 }, { x:-3,y:4 }]);
    terrain.strokeStyle = chapter.line;
    terrain.stroke();
    terrain.restore();
  }
  drawEndpoint(terrain, map.path[0], false);
  drawEndpoint(terrain, map.path.at(-1), true);
  map.gates.forEach((distance, i) => {
    const { x, y } = positionOnPath(distance);
    const zone = zones[i];
    circle(terrain, x, y, 16, chapter.land);
    terrain.strokeStyle = zone.color;
    terrain.lineWidth = 2;
    terrain.stroke();
    terrain.fillStyle = zone.color;
    terrain.font = "bold 17px system-ui";
    terrain.textAlign = "center";
    terrain.textBaseline = "middle";
    terrain.fillText(zone.code, x, y + .5);
  });
}

function hexagon(context, x, y, radius) {
  context.beginPath();
  for (let i = 0; i < 6; i += 1) {
    const angle = i * Math.PI / 3;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;
    if (i === 0) context.moveTo(px, py);
    else context.lineTo(px, py);
  }
  context.closePath();
}

function drawEndpoint(context, point, base) {
  const { x, y } = point;
  const mark = base ? "#9cf9e8" : "#ffadbb";
  circle(context, x, y, 32, mark + "26");
  hexagon(context, x, y, 25);
  context.fillStyle = base ? "#21605e" : "#754259";
  context.strokeStyle = mark;
  context.lineWidth = 2;
  context.fill();
  context.stroke();
  hexagon(context, x, y, 16);
  context.lineWidth = 1;
  context.stroke();
  circle(context, x, y, 6, mark);
  if (base) {
    for (const offset of [-26, 26]) {
      context.fillStyle = "#20394f";
      context.fillRect(x + offset - 5, y - 7, 10, 14);
      context.strokeRect(x + offset - 5, y - 7, 10, 14);
    }
  }
}

function drawRock(rock) {
  const spec = debris[rock.type];
  const { x, y } = rock.point;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rock.spin + (motion.matches ? 0 : rock.distance * .012));
  ctx.beginPath();
  for (let i = 0; i < 7; i += 1) {
    const angle = i * 2 * Math.PI / 7;
    const radius = spec.radius * [.84, .96, .73, 1, .9, .8, 1][i];
    const px = Math.sin(angle) * radius;
    const py = Math.cos(angle) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = rock.frozen ? "#a7fff8" : spec.color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#20233c";
  ctx.stroke();
  circle(ctx, -2, 3, spec.radius / 4, "#444a6b88");
  ctx.restore();
  if (rock.hp < rock.max) {
    ctx.fillStyle = "#10182f";
    ctx.fillRect(x - 10, y - spec.radius - 8, 20, 3);
    ctx.fillStyle = "#9ffee1";
    ctx.fillRect(x - 10, y - spec.radius - 8, 20 * Math.max(0, rock.hp / rock.max), 3);
  }
}

function drawBoard() {
  ctx.drawImage(landscape, 0, 0);
  const bot = session.built.get(session.inspected);
  if (bot && bot.type !== "solar" && session.phase === "prep") {
    const zone = session.map.pads[bot.index].zone;
    const origin = session.map.pads[bot.index];
    const gate = positionOnPath(session.map.gates[zone]);
    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = zones[zone].color;
    ctx.lineWidth = 2;
    trail(ctx, [origin, gate]);
    ctx.stroke();
    ctx.restore();
  }
  for (const rock of session.rocks) drawRock(rock);
  for (const effect of session.effects) {
    if (effect.kind === "ray") {
      ctx.globalAlpha = Math.min(1, effect.life / .14);
      ctx.lineWidth = 3;
      ctx.strokeStyle = effect.color;
      trail(ctx, [effect.from, effect.to]);
      ctx.stroke();
    } else {
      ctx.globalAlpha = Math.min(1, effect.life * 2);
      ctx.fillStyle = effect.color;
      ctx.textAlign = "center";
      ctx.font = "bold 18px system-ui";
      ctx.fillText(effect.text, effect.from.x, effect.from.y - 35 + effect.life * 17);
    }
    ctx.globalAlpha = 1;
  }
}

function bindControls() {
  byId("start").addEventListener("click", () => {
    switch (session.phase) {
      case "prep": openWave(); break;
      case "wave":
        session.phase = "paused";
        playSound("pause");
        say("拦截已暂停。这一波结束后就能重新布置。");
        render();
        break;
      case "paused":
        session.phase = "wave";
        playSound("resume");
        say("继续拦截！观察碎石在哪个航段被挡住。");
        render();
        break;
      case "lost": goTo(session.index); break;
      case "won":
        if (session.index + 1 === missions.length) openResult();
        else goTo(session.index + 1);
        break;
    }
  });
  byId("speed").addEventListener("click", () => {
    slow = !slow;
    playSound("select");
    render();
  });
  byId("repair").addEventListener("click", () => {
    if (session.energy < REPAIR_COST || session.shield === 100 || session.phase !== "prep") return;
    const healed = Math.min(30, 100 - session.shield);
    session.shield += healed;
    session.energy -= REPAIR_COST;
    playSound("repair");
    say("护盾 +" + healed + "。");
    render();
  });
  byId("upgrade").addEventListener("click", () => {
    const bot = session.built.get(session.inspected);
    if (!bot || bot.level >= 3 || session.phase !== "prep") return;
    const cost = upgradeCost(bot);
    if (session.energy < cost) return;
    session.energy -= cost;
    bot.spent += cost;
    bot.level += 1;
    playSound("upgrade");
    say(robots[bot.type].name + " 升到了 " + bot.level + " 级。");
    render();
  });
  byId("recycle").addEventListener("click", () => {
    const bot = session.built.get(session.inspected);
    if (!bot || session.phase !== "prep") return;
    const refund = Math.floor(bot.spent * .65);
    session.energy += refund;
    session.built.delete(session.inspected);
    session.inspected = null;
    playSound("recycle");
    say("已回收机器人，返还 " + refund + " 能量。");
    render();
  });
  byId("restart").addEventListener("click", restartMission);
  byId("scan").addEventListener("click", openDiscovery);
  byId("help").addEventListener("click", explainGame);
  byId("archive").addEventListener("click", openLogbook);
  byId("close").addEventListener("click", () => popup.close());
  byId("jump").addEventListener("click", () => byId("route").scrollIntoView({ behavior:motion.matches ? "auto" : "smooth" }));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && session.phase === "wave") {
      session.phase = "paused";
      say("拦截已暂停。准备好以后可以继续。");
      render();
    }
  });
}

let previousFrame;
function frame(now) {
  const delta = previousFrame === undefined ? 0 : Math.min((now - previousFrame) / 1000, .05);
  previousFrame = now;
  if (session.phase === "wave" && !popup.open) {
    tick(delta * (slow ? .6 : 1));
    drawBoard();
  }
  requestAnimationFrame(frame);
}

setupRobotButtons();
bindControls();
bindSoundControls();
const firstUnfinished = missions.findIndex((mission, index) => !progress.strategy[index] && unlocked(index));
beginMission(firstUnfinished < 0 ? missions.length - 1 : firstUnfinished);
requestAnimationFrame(frame);
</script>
</body>
